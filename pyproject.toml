[project]
name = "phantom-foundry"
version = "0.1.0"
description = "Open-source font foundry reviving public domain typefaces from scanned specimen books"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
    "requests>=2.32",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "fonttools[ufo]>=4.50",
    "ufoLib2>=0.16",
    "fontmake>=3.9",
    "skia-pathops>=0.8",
    "svgelements>=1.9",
    "numpy>=2.5.2",
]

[project.scripts]
foundry = "foundry.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools/foundry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
